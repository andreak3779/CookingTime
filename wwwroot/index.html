<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Phase 15: Content-Security-Policy as defence in depth.
         Two directives are NOT optional for this app:
           - script-src 'wasm-unsafe-eval' - the .NET WASM runtime instantiates
             the Mono runtime via WebAssembly.compile; without it the app
             refuses to boot.
           - style-src 'unsafe-inline' - Pages/Index.razor uses inline
             style="..." attributes.
         'unsafe-inline' is deliberately scoped to style-src only; script-src
         gets no inline allowance. A meta tag is used rather than a server
         header because this app is served as static files (see
         docs/plan-kubernetes.md for the nginx layer that can also send it).
         Add 'self' to connect-src so the WASM payload can fetch its own
         framework files.

         NOTE: the clickjacking directive is deliberately NOT here. A
         meta-delivered policy ignores it (the browser logs a warning), so it
         must come from an HTTP header instead - add it to the nginx layer
         when the container work lands. -->
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self';
                   script-src 'self' 'wasm-unsafe-eval';
                   style-src 'self' 'unsafe-inline';
                   img-src 'self' data:;
                   font-src 'self';
                   connect-src 'self';
                   object-src 'none';
                   base-uri 'self';
                   form-action 'self'" />
    <title>CookingTime</title>
    <base href="/" />
    <!-- Phase 12: icon set from the cookingtime-theme design package.
         The old markup pointed at a legacy .ico file that does not exist in
         the repo - every page load produced a 404. The SVG icon is the primary
         one; the PNGs cover browsers that do not render SVG favicons and
         provide the apple-touch-icon. -->
    <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="icons/icon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png" />
    <link href="css/cookingtime.css" rel="stylesheet" />
    <!-- Phase 12: apply the persisted theme preference BEFORE first paint.
         This must stay a blocking script in <head>: loading it at the end
         of <body> would flash the light theme on every load for users who
         chose dark mode. See wwwroot/js/theme.js. -->
    <script src="js/theme.js"></script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>
    <!-- Phase 7b: the .NET 10 Blazor WebAssembly SDK only emits
         _framework/blazor.webassembly.js. Referencing the older
         _framework/blazor.web.js name (Blazor Server / .NET 6
         templates) returns 404 and the WASM payload never bootstraps.
         See docs/phases/phase-7b-blazor-boot-script.md for context. -->
    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
