<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CookingTime</title>
    <base href="/" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link href="css/app.css" rel="stylesheet" />
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>
    <!-- Phase 7b: the .NET 10 Blazor WebAssembly SDK only emits
         _framework/blazor.webassembly.js. Referencing the older
         _framework/blazor.web.js name (Blazor Server / .NET 6
         templates) returns 404 and the WASM payload never bootstraps.
         See docs/phases/phase-7b-blazor-boot-script.md for context. -->
    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
