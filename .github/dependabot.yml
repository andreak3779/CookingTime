# filepath: .github/dependabot.yml
#
# Phase 16: keep the pinned dependencies current.
#
# Every GitHub Action in ci.yml is pinned to a full commit SHA, and every
# PackageReference is pinned to an exact version. That is what makes the
# build reproducible - but it also means nothing upgrades itself. Dependabot
# opens the pull request; a human reviews it and the pin is bumped.
#
# This is the counterpart to the pinning, not a replacement for it: without
# this file, SHA-pinned actions would stay frozen forever.
#
# Noise control (added after the repository was republished and Dependabot
# opened 21 pull requests at once, most of them duplicates):
#   - One NuGet block covers the root project and all three test projects
#     (`directories`), so a package used in several projects is ONE pull
#     request, not one per project.
#   - Minor and patch updates are grouped into a single pull request.
#   - Major NuGet updates are ignored. With exact pins and committed lock
#     files, a major bump is a deliberate migration (for example bUnit 2,
#     coverlet 10, or FluentAssertions 8, which changed its licence terms),
#     not something to merge from a bot. Raise it by hand when wanted.
#   - At most 3 open pull requests per ecosystem.
#   - A 7-day cooldown: a version is not proposed until it has been published for a week. A
#     brand-new release can be yanked or found to be compromised; waiting gives the ecosystem
#     time to notice. Security updates are not delayed by it.

version: 2

updates:
  # GitHub Actions - updates the SHA pins in .github/workflows/*.yml.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: "ci"

  # NuGet - the root project and the three test projects in one block.
  - package-ecosystem: nuget
    directories:
      - /
      - /tests/CookingTime.UnitTests
      - /tests/CookingTime.ComponentTests
      - /tests/CookingTime.IntegrationTests
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    groups:
      nuget-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
    labels:
      - dependencies
    commit-message:
      prefix: "build"
